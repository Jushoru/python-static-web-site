name: Build and deploy report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs grant additional permissions only where needed.
permissions:
  contents: read

# Keep publication jobs in order; PR checks have a separate group per PR.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      # Use exactly the same key function and interpreter as report preparation.
      - name: Calculate report cache key
        id: report-key
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "scripts")
          from report_cache import cache_key
          print("key=" + cache_key())
          PY

      - name: Restore report cache
        id: report-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/report/${{ steps.report-key.outputs.key }}
          key: report-v1-${{ steps.report-key.outputs.key }}

      # The runner is already isolated. Reuse its Python for both Nox sessions.
      - name: Run tests and build strictly
        run: python -m nox --no-venv -s check build

      - name: Save report cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.report-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/report/${{ steps.report-key.outputs.key }}
          key: report-v1-${{ steps.report-key.outputs.key }}

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Upload only the built website. Sources, virtualenvs and caches stay out.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
